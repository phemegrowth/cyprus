<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you | Advrest, property platform in Nicosia</title>
  <meta name="description" content="Thank you for your message to Advrest. We will get back to you soon.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Thank you | Advrest">
  <meta property="og:description" content="Thank you for your message to Advrest.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/img/hero-apartments.jpg">
  <meta name="theme-color" content="#2EC1D1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Darker+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
</head>
<body>
<header class="header" data-header>
  <div class="wrap header__in">
    <a class="brand" href="./index.html" aria-label="Advrest, home">
      <img class="brand__mark" src="./assets/logo-mark.jpg" alt="Advrest" width="216" height="156">
      <span class="brand__name">Advrest</span>
    </a>
  </div>
</header>

<main id="main" class="thanks">
  <div class="wrap">
    <div class="thanks__box">
      <p class="kicker"><span class="pin" aria-hidden="true"></span>Message sent</p>
      <h1>Thank you. We have your message.</h1>
      <p>Advrest will read it and get back to you soon. If it is urgent, call the office on +357 70 076789.</p>
      <div class="hero__cta">
        <a class="btn btn--teal" href="./index.html">Back to the home page</a>
        <a class="btn btn--line" href="tel:+35770076789">Call +357 70 076789</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer__base">
    <span>© <span data-year>2026</span> Advrest, Kritis 2, Nicosia 1060</span>
    <a class="ul" href="mailto:info@advrest.com">info@advrest.com</a>
    <a class="ul" href="https://phemegrowth.com">Website by Pheme Growth</a>
  </div>
</footer>
<script>document.querySelectorAll('[data-year]').forEach(function(e){e.textContent=new Date().getFullYear();});</script>
</body>
</html>
